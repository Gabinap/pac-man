[project]
name = "pac-man"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "flake8>=7.3.0",
    "mazegenerator",
    "mypy>=1.20.2",
    "ursina>=8.3.0",
]

[[tool.mypy.overrides]]
module = ["ursina.*", "panda3d.*", "direct.*", "mazegenerator.*", "pygltflib.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = [
    "src.visualization",
    "src.entities",
    "src.views.base",
    "src.views.main_menu",
    "src.views.highscores",
    "src.views.instructions",
]
disallow_subclassing_any = false

[tool.pyright]
reportArgumentType = false

[tool.uv.sources]
mazegenerator = { path = "mazegenerator-2.0.1-py3-none-any.whl" }
